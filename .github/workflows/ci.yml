name: CI

on:
  push:
    branches: ['**']
    tags: ['pcb-v*', '[0-9]*.*']
  pull_request:
    branches: ['**']

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential gcovr

      - name: Validate factory flash tool
        working-directory: Firmware
        run: |
          python3 -m py_compile tools/factory_flash.py
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          script = Path("tools/factory_flash.py")
          spec = importlib.util.spec_from_file_location("factory_flash", script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          schema = module.read_schema()
          assert schema["LINKEY_FACTORY_PARTITION_LABEL"] == "factory_data"
          assert schema["LINKEY_FACTORY_NAMESPACE"] == "linkey"
          assert schema["LINKEY_FACTORY_KEY_MQTT_PASSWORD"] == "mqtt-password"
          assert schema["LINKEY_FACTORY_KEY_BLE_POP"] == "ble-pop"
          assert schema["LINKEY_FACTORY_FALLBACK_MQTT_PASSWORD"] == "mqtt-password"
          assert schema["LINKEY_FACTORY_FALLBACK_BLE_POP"] == "linkey-pop"
          PY

      - name: Configure
        run: cmake -S Firmware/test/host -B Firmware/test/host/build -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build Firmware/test/host/build

      - name: Run tests
        run: ctest --test-dir Firmware/test/host/build --output-on-failure

      - name: Generate coverage report
        run: gcovr --root Firmware/test/host --output Firmware/test/host/coverage.lcov --lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./Firmware/test/host/coverage.lcov
          flags: host-tests
          fail_ci_if_error: false

  firmware-build:
    name: ESP-IDF firmware build (${{ matrix.variant }})
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            build_dir: build
            sdkconfig_defaults: sdkconfig.defaults
          - variant: debug-logs
            build_dir: build-debug
            sdkconfig_defaults: sdkconfig.defaults;sdkconfig.ci-debug.defaults
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build firmware (${{ matrix.variant }})
        shell: bash
        working-directory: Firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py \
            -B "${{ matrix.build_dir }}" \
            -DSDKCONFIG_DEFAULTS="${{ matrix.sdkconfig_defaults }}" \
            build

  qemu-emulation:
    name: QEMU emulation (${{ matrix.tariff }})
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    strategy:
      fail-fast: false
      matrix:
        tariff: [base, hphc, ejp, tempo]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install QEMU (xtensa)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Install MQTT broker tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends mosquitto mosquitto-clients

      - name: Run QEMU emulation and capture MQTT
        shell: bash
        working-directory: Firmware
        env:
          TARIFF_OPTION: ${{ matrix.tariff }}
        run: |
          . $IDF_PATH/export.sh
          eval "$(python "$IDF_PATH/tools/idf_tools.py" export)"

          MQTT_USERNAME="linkey_ddeeff"
          MQTT_PASSWORD="mqtt-password"
          mosquitto_passwd -b -c mosquitto-ci.passwd "$MQTT_USERNAME" "$MQTT_PASSWORD"

          cat > mosquitto-ci.conf <<'EOF'
          per_listener_settings false
          allow_anonymous false
          password_file mosquitto-ci.passwd
          listener 1884 0.0.0.0
          protocol mqtt
          log_dest stdout
          log_timestamp true
          log_type all
          persistence false
          EOF

          mosquitto -c mosquitto-ci.conf > "mosquitto-${TARIFF_OPTION}.log" 2>&1 &
          MOSQUITTO_PID=$!

          cleanup() {
            kill "${QEMU_PID:-}" "${SUB_PID:-}" "${MOSQUITTO_PID:-}" 2>/dev/null || true
            wait "${QEMU_PID:-}" "${SUB_PID:-}" "${MOSQUITTO_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          BROKER_READY=0
          for _ in $(seq 1 30); do
            if mosquitto_pub -h localhost -p 1884 -u "$MQTT_USERNAME" -P "$MQTT_PASSWORD" -t ci/probe -m ready >/dev/null 2>&1; then
              BROKER_READY=1
              break
            fi
            sleep 1
          done
          if [ "$BROKER_READY" -ne 1 ]; then
            echo "::error::Mosquitto did not become ready on localhost:1884"
            cat "mosquitto-${TARIFF_OPTION}.log"
            exit 1
          fi

          stdbuf -oL mosquitto_sub -h localhost -p 1884 -u "$MQTT_USERNAME" -P "$MQTT_PASSWORD" -t '#' -v > "mqtt-${TARIFF_OPTION}.log" 2>&1 &
          SUB_PID=$!

          ./run_qemu_linkey.sh --tariff_option "$TARIFF_OPTION" --build > "qemu-${TARIFF_OPTION}.log" 2>&1 &
          QEMU_PID=$!
          QEMU_TOPIC_PREFIX="linkey/ddeeff"

          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if grep -Fxq "${QEMU_TOPIC_PREFIX}/status online" "mqtt-${TARIFF_OPTION}.log" \
              && grep -Eq '^homeassistant/device/linkey_[0-9a-f]{12}/config ' "mqtt-${TARIFF_OPTION}.log" \
              && grep -Eq "^${QEMU_TOPIC_PREFIX}/state " "mqtt-${TARIFF_OPTION}.log"; then
              break
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              set +e
              wait "$QEMU_PID"
              QEMU_RC=$?
              set -e
              echo "::error::QEMU exited before expected MQTT messages were captured"
              echo "QEMU exit code: ${QEMU_RC}"
              exit 1
            fi
            sleep 2
          done

          mosquitto_pub -h localhost -p 1884 -u "$MQTT_USERNAME" -P "$MQTT_PASSWORD" -t "${QEMU_TOPIC_PREFIX}/debug/request" -m GET_TIC_FRAME

          deadline=$((SECONDS + 60))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if grep -Eq "^${QEMU_TOPIC_PREFIX}/debug/tic_frame " "mqtt-${TARIFF_OPTION}.log"; then
              break
            fi
            if ! kill -0 "$QEMU_PID" 2>/dev/null; then
              set +e
              wait "$QEMU_PID"
              QEMU_RC=$?
              set -e
              echo "::error::QEMU exited before debug TIC frame response was captured"
              echo "QEMU exit code: ${QEMU_RC}"
              exit 1
            fi
            sleep 1
          done

          kill "$QEMU_PID" 2>/dev/null || true
          wait "$QEMU_PID" 2>/dev/null || true

          echo "---- qemu-${TARIFF_OPTION}.log ----"
          cat "qemu-${TARIFF_OPTION}.log"
          echo "---- mqtt-${TARIFF_OPTION}.log ----"
          cat "mqtt-${TARIFF_OPTION}.log"
          echo "---- mosquitto-${TARIFF_OPTION}.log ----"
          cat "mosquitto-${TARIFF_OPTION}.log"

      - name: Assert QEMU MQTT behavior
        shell: bash
        working-directory: Firmware
        env:
          TARIFF_OPTION: ${{ matrix.tariff }}
        run: |
          python3 test/qemu/assert_mqtt.py \
            --tariff-option "$TARIFF_OPTION" \
            --mqtt-log "mqtt-${TARIFF_OPTION}.log" \
            --qemu-log "qemu-${TARIFF_OPTION}.log"

      - name: Upload QEMU MQTT logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-emulation-${{ matrix.tariff }}-logs
          path: |
            Firmware/qemu-${{ matrix.tariff }}.log
            Firmware/mqtt-${{ matrix.tariff }}.log
            Firmware/mosquitto-${{ matrix.tariff }}.log

  qemu-manual-provisioning:
    name: QEMU manual provisioning trigger
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install QEMU (xtensa)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Run manual provisioning trigger emulation
        shell: bash
        working-directory: Firmware
        run: |
          . $IDF_PATH/export.sh
          eval "$(python "$IDF_PATH/tools/idf_tools.py" export)"

          ./run_qemu_linkey.sh \
            --tariff_option base \
            --manual-provision-test \
            --build-only

          timeout 45s ./run_qemu_linkey.sh \
            --tariff_option base \
            --manual-provision-test > qemu-manual-provisioning.log 2>&1 || true

          echo "---- qemu-manual-provisioning.log ----"
          cat qemu-manual-provisioning.log

      - name: Assert manual provisioning trigger
        shell: bash
        working-directory: Firmware
        run: |
          python3 test/qemu/assert_manual_provisioning.py \
            --qemu-log qemu-manual-provisioning.log

      - name: Upload manual provisioning QEMU log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-manual-provisioning-log
          path: Firmware/qemu-manual-provisioning.log

  pcb-drc:
    name: KiCad DRC
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run DRC
        working-directory: PCB
        run: kicad-cli pcb drc --severity-error --schematic-parity --format json --exit-code-violations LinKey.kicad_pcb

      - name: Upload DRC report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: LinKey-drc
          path: PCB/LinKey-drc.json

  pcb-fab:
    name: KiCad fab files
    runs-on: ubuntu-latest
    needs: pcb-drc
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute PCB version from git tag
        id: pcbver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          raw=$(git describe --tags --match 'pcb-v*' || true)
          if [ -z "$raw" ]; then
            echo "No pcb-v* tag reachable from HEAD. Create one (e.g. 'git tag pcb-v1.0 <commit> && git push --tags') so fab artifacts can be versioned." >&2
            exit 1
          fi
          version="${raw#pcb-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inject PCB_VERSION into project for silkscreen
        working-directory: PCB
        env:
          VERSION: ${{ steps.pcbver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "LinKey.kicad_pro"
          d = json.load(open(p))
          d.setdefault("text_variables", {})["PCB_VERSION"] = os.environ["VERSION"]
          json.dump(d, open(p, "w"), indent=2)
          PY

      - name: Generate fab files
        working-directory: PCB
        run: kicad-cli jobset run --stop-on-error -f fab-output.kicad_jobset LinKey.kicad_pro

      - name: Upload fab artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LinKey-pcb-${{ steps.pcbver.outputs.version }}-fab
          path: PCB/fab-output/
