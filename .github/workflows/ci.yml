name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Configure
        run: cmake -S Firmware/test/host -B Firmware/test/host/build

      - name: Build
        run: cmake --build Firmware/test/host/build

      - name: Run tests
        run: ctest --test-dir Firmware/test/host/build --output-on-failure

  firmware-build:
    name: ESP-IDF firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        working-directory: Firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build
