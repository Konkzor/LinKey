name: CI

on:
  push:
    branches: ['**']
    tags: ['pcb-v*', '[0-9]*.*']
  pull_request:
    branches: ['**']

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Configure
        run: cmake -S Firmware/test/host -B Firmware/test/host/build

      - name: Build
        run: cmake --build Firmware/test/host/build

      - name: Run tests
        run: ctest --test-dir Firmware/test/host/build --output-on-failure

  firmware-build:
    name: ESP-IDF firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        working-directory: Firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

  pcb-drc:
    name: KiCad DRC
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run DRC
        working-directory: PCB
        run: kicad-cli pcb drc --severity-error --schematic-parity --format json --exit-code-violations LinKey.kicad_pcb

      - name: Upload DRC report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: LinKey-drc
          path: PCB/LinKey-drc.json

  pcb-fab:
    name: KiCad fab files
    runs-on: ubuntu-latest
    needs: pcb-drc
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute PCB version from git tag
        id: pcbver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          raw=$(git describe --tags --match 'pcb-v*' || true)
          if [ -z "$raw" ]; then
            echo "No pcb-v* tag reachable from HEAD. Create one (e.g. 'git tag pcb-v1.0 <commit> && git push --tags') so fab artifacts can be versioned." >&2
            exit 1
          fi
          version="${raw#pcb-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inject PCB_VERSION into project for silkscreen
        working-directory: PCB
        env:
          VERSION: ${{ steps.pcbver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "LinKey.kicad_pro"
          d = json.load(open(p))
          d.setdefault("text_variables", {})["PCB_VERSION"] = os.environ["VERSION"]
          json.dump(d, open(p, "w"), indent=2)
          PY

      - name: Generate fab files
        working-directory: PCB
        run: kicad-cli jobset run --stop-on-error -f fab-output.kicad_jobset LinKey.kicad_pro

      - name: Upload fab artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LinKey-pcb-${{ steps.pcbver.outputs.version }}-fab
          path: PCB/fab-output/
