name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Configure
        run: cmake -S Firmware/test/host -B Firmware/test/host/build

      - name: Build
        run: cmake --build Firmware/test/host/build

      - name: Run tests
        run: ctest --test-dir Firmware/test/host/build --output-on-failure

  firmware-build:
    name: ESP-IDF firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        working-directory: Firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

  pcb-drc:
    name: KiCad DRC
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run DRC
        working-directory: PCB
        run: kicad-cli pcb drc --severity-error --schematic-parity --format json --exit-code-violations LinKey.kicad_pcb

      - name: Upload DRC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drc-report
          path: PCB/LinKey-drc.json

  pcb-fab:
    name: KiCad fab files
    runs-on: ubuntu-latest
    needs: pcb-drc
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Gerbers
        working-directory: PCB
        run: |
          mkdir -p fab/gerbers
          kicad-cli pcb export gerbers --output fab/gerbers/ LinKey.kicad_pcb

      - name: Generate drill files
        working-directory: PCB
        run: kicad-cli pcb export drill --output fab/gerbers/ LinKey.kicad_pcb

      - name: Generate position file
        working-directory: PCB
        run: |
          mkdir -p fab
          kicad-cli pcb export pos --output fab/LinKey-pos.csv --format csv --units mm LinKey.kicad_pcb

      - name: Generate BOM
        working-directory: PCB
        run: kicad-cli sch export bom --output fab/LinKey-bom.csv LinKey.kicad_sch

      - name: Upload fab artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fab
          path: PCB/fab/
