name: CI

on:
  push:
    branches: ['**']
    tags: ['pcb-v*', '[0-9]*.*']
  pull_request:
    branches: ['**']

jobs:
  host-tests:
    name: Host unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Configure
        run: cmake -S Firmware/test/host -B Firmware/test/host/build

      - name: Build
        run: cmake --build Firmware/test/host/build

      - name: Run tests
        run: ctest --test-dir Firmware/test/host/build --output-on-failure

  firmware-build:
    name: ESP-IDF firmware build
    runs-on: ubuntu-latest
    container: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        working-directory: Firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Upload firmware build
        uses: actions/upload-artifact@v6
        with:
          name: firmware-build
          path: Firmware/build
          retention-days: 7

  boot-smoke:
    name: QEMU boot smoke
    runs-on: ubuntu-latest
    needs: firmware-build
    container: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Download firmware build
        uses: actions/download-artifact@v4
        with:
          name: firmware-build
          path: Firmware/build

      - name: Install QEMU (xtensa)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa

      - name: Run firmware in QEMU
        shell: bash
        working-directory: Firmware
        run: |
          . $IDF_PATH/export.sh
          eval "$(python "$IDF_PATH/tools/idf_tools.py" export)"
          set +e
          # Boot for ~20s. -no-reboot stops the VM on panic instead of looping.
          # idf.py qemu already appends -nographic -serial mon:stdio.
          timeout --preserve-status 20s \
            idf.py qemu --qemu-extra-args="-no-reboot" \
            > qemu.log 2>&1
          echo "---- qemu.log ----"
          cat qemu.log

      - name: Assert boot succeeded
        shell: bash
        working-directory: Firmware
        run: |
          set -e
          # Scope: validate the IDF boot chain reaches app_main entry. Anything
          # after that runs project code that touches the ULP/RTC peripherals
          # QEMU does not model, so we only fail on panics BEFORE app_main.
          marker="main_task: Calling app_main()"
          if ! grep -F "$marker" qemu.log; then
            echo "::error::IDF did not reach app_main() within 20s"
            exit 1
          fi
          pre_app_main=$(sed -n "1,/$(printf '%s\n' "$marker" | sed 's/[][\.*^$/]/\\&/g')/p" qemu.log)
          if echo "$pre_app_main" | grep -E "Guru Meditation Error|abort\(\) was called|assert failed:|CORRUPT HEAP"; then
            echo "::error::Panic/abort detected during IDF startup (before app_main)"
            exit 1
          fi
          if ! echo "$pre_app_main" | grep -E "app_init: Project name: +linky-ulp-monitor\b" >/dev/null; then
            echo "::error::Wrong or missing project name in boot log (expected 'linky-ulp-monitor')"
            exit 1
          fi
          for part in nvs phy_init factory; do
            if ! echo "$pre_app_main" | grep -E "boot: +[0-9]+ +$part\b" >/dev/null; then
              echo "::error::Partition '$part' not found in bootloader partition table log"
              exit 1
            fi
          done
          echo "Boot smoke OK (IDF boot chain reached app_main; project + partitions verified)"

      - name: Upload QEMU log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-boot-log
          path: Firmware/qemu.log

  pcb-drc:
    name: KiCad DRC
    runs-on: ubuntu-latest
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run DRC
        working-directory: PCB
        run: kicad-cli pcb drc --severity-error --schematic-parity --format json --exit-code-violations LinKey.kicad_pcb

      - name: Upload DRC report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: LinKey-drc
          path: PCB/LinKey-drc.json

  pcb-fab:
    name: KiCad fab files
    runs-on: ubuntu-latest
    needs: pcb-drc
    container:
      image: kicad/kicad:nightly-full-trixie
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute PCB version from git tag
        id: pcbver
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          raw=$(git describe --tags --match 'pcb-v*' || true)
          if [ -z "$raw" ]; then
            echo "No pcb-v* tag reachable from HEAD. Create one (e.g. 'git tag pcb-v1.0 <commit> && git push --tags') so fab artifacts can be versioned." >&2
            exit 1
          fi
          version="${raw#pcb-}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Inject PCB_VERSION into project for silkscreen
        working-directory: PCB
        env:
          VERSION: ${{ steps.pcbver.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          p = "LinKey.kicad_pro"
          d = json.load(open(p))
          d.setdefault("text_variables", {})["PCB_VERSION"] = os.environ["VERSION"]
          json.dump(d, open(p, "w"), indent=2)
          PY

      - name: Generate fab files
        working-directory: PCB
        run: kicad-cli jobset run --stop-on-error -f fab-output.kicad_jobset LinKey.kicad_pro

      - name: Upload fab artifacts
        uses: actions/upload-artifact@v6
        with:
          name: LinKey-pcb-${{ steps.pcbver.outputs.version }}-fab
          path: PCB/fab-output/
